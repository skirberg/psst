# Every morning: refresh the Miami forecast and commit it. The push redeploys psst.miami on Vercel,
# so the weather shown is never more than a day old. No secrets needed.
name: Daily forecast
on:
  schedule:
    - cron: '17 10 * * *' # 6:17am Miami in summer time, 5:17am in winter
  workflow_dispatch:
permissions:
  contents: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node app/scripts/weather-fetch.mjs
      - name: Commit if the forecast changed
        run: |
          if git diff --quiet app/src/lib/weather.json; then echo "Forecast unchanged"; exit 0; fi
          git config user.name "Sami Kirberg"
          git config user.email "samikirberg@gmail.com"
          git add app/src/lib/weather.json
          git commit -m "Daily forecast"
          git push
